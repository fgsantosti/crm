server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Arquivos com hash no nome (gerados pelo Vite): podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado: senão o navegador continua com a versão antiga
    # (que aponta para o JS antigo) depois de um deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
