x-backend: &backend
  build: ./backend
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY no ambiente protegido}
    POSTGRES_DB: crm
    POSTGRES_USER: crm
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente protegido}
    POSTGRES_HOST: db
    ALLOWED_HOSTS: crm.axiomaia.com.br,web,127.0.0.1,localhost
    CORS_ALLOWED_ORIGINS: https://crm.axiomaia.com.br
    CSRF_TRUSTED_ORIGINS: https://crm.axiomaia.com.br
    # DJANGO_HTTPS=true liga SECURE_SSL_REDIRECT, que também redireciona o healthcheck
    # interno (HTTP puro, sem TLS) e o deixa "unhealthy". O Caddy já redireciona
    # HTTP->HTTPS sozinho pro tráfego externo; deixado desligado até isolar o healthcheck
    # dessa regra (ex.: exceção por path) sem gambiarra.
    DJANGO_HTTPS: "false"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CHANNEL_REDIS_URL: redis://redis:6379/2
    # Convite de atendente (código de 6 dígitos), credenciais provisórias e
    # troca de e-mail de perfil. Sem EMAIL_HOST_USER/PASSWORD configurados em
    # prod.env, cai no backend console (só loga, não envia de verdade).
    EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
    EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    FRONTEND_BASE_URL: https://crm.axiomaia.com.br
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no ambiente protegido}
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U crm -d crm]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  setup:
    <<: *backend
    restart: 'no'
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py collectstatic --noinput']
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *backend
    volumes:
      - media_data:/app/media
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=info]
    depends_on:
      setup:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: [celery, -A, config, beat, --loglevel=info, --scheduler, django_celery_beat.schedulers:DatabaseScheduler]
    depends_on:
      setup:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  crm_data:
  redis_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
